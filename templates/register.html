{% extends 'base.html' %}

{% block title %}Register &mdash; The Dragonseed Company{% endblock %}

{% block content %}
<section class="auth-card card col-md-4 mx-auto">
    <div class="card-body">
        <h1 class="h3 card-title">Join the Company</h1>
        <p class="text-muted">Registration creates an adventurer account.</p>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" name="username" id="username"
                       required minlength="3" maxlength="30" autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" name="password" id="password"
                       required minlength="6">
            </div>
            <button class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 mb-0">Already a member? <a href="{{ url_for('login') }}">Log in</a>.</p>
    </div>
</section>
{% endblock %}
